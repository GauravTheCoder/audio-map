# Pull request titles follow Conventional Commits (https://www.conventionalcommits.org):
#   type(optional scope)!: description
# e.g. "feat(phone): add a nearby list", "fix(grid): stop naming areas after bus stops".
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # passed through the environment, never pasted into the script
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*[^. ]$"; then
            echo "::error::PR title \"$TITLE\" does not follow Conventional Commits."
            echo "Use: type(scope): description, where type is one of: ${types//|/, }."
            echo "The scope is optional; the description should not end with a full stop."
            echo "Examples: feat(phone): add a nearby list / fix(grid): stop naming areas after bus stops"
            exit 1
          fi
          if [ "${#TITLE}" -gt 100 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it to 100."
            exit 1
          fi
          echo "OK: $TITLE"
